packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "core-js": true
  esbuild: true
  sharp: true
  "vue-demi": true
  workerd: true

overrides:
  # One copy only: the app and @supabase/ssr could resolve different versions and the server
  # bundle shipped both (about 800 KB of duplicated client code).
  "@supabase/supabase-js": "2.119.0"
  vue: "3.5.45"
  "@intlify/shared": "11.4.18"
  "@vue/runtime-core": "3.5.45"
  "@vue/runtime-dom": "3.5.45"
  "@vue/reactivity": "3.5.45"
  "@vue/compiler-core": "3.5.45"
  "@vue/compiler-dom": "3.5.45"
  "@vue/compiler-sfc": "3.5.45"
  "@vue/compiler-ssr": "3.5.45"
  "@vue/server-renderer": "3.5.45"
  "@vue/shared": "3.5.45"

packageExtensions:
  vue-sonner:
    peerDependencies:
      nuxt: "-"

patchedDependencies:
  lucide-vue-next: patches/lucide-vue-next.patch
