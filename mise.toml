[tools]
"conda:graphviz" = "14.1.2"
deno = "2.1.9"
go = "1.27.3"
node = "24"

[env]
# _.file = '.env.production'
_.file = '.env.development'

[tasks.doppler-setup]
description = "Links this checkout to the Doppler dubbingbase/dev config"
hide = true
# CI runners have no Doppler binary; only link when it is installed.
run = "if command -v doppler >/dev/null 2>&1; then doppler setup --no-interactive --project dubbingbase --config dev; else echo 'doppler not installed, skipping setup'; fi"

[tasks.install]
description = "Installs every workspace"
depends = ["doppler-setup"]
run = "pnpm install"

[tasks.backend]
description = "Starts the Supabase backend"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm exec supabase start --runtime docker --preparation on-demand >/dev/null"

[tasks.backend-stop]
description = "Stops this worktree's Supabase backend and keeps its data"
dir = "packages/database"
run = "pnpm exec supabase stop"


[tasks.format]
description = "Formats the whole repository"
depends = ["install"]
run = "pnpm run format"

[tasks.format-staged]
description = "Format only staged files using lint-staged"
depends = ["install"]
run = "npx lint-staged"

[tasks.dev]
description = "Runs the workspace development servers"
depends = ["website"]

[tasks.build-web]
description = "Builds the web app"
depends = ["website-install"]
run = "pnpm --filter @app/website build"

[tasks.migrate-up]
description = "Runs the database migration"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm exec supabase migration up"

[tasks.migrate-down]
description = "Reverts the database migration"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm exec supabase migration down"

[tasks.database-install]
description = "Installs only the database workspace dependencies"
depends = ["doppler-setup"]
run = "pnpm install --filter @app/supabase..."

[tasks.website-install]
description = "Installs only the website workspace and its dependencies"
depends = ["doppler-setup"]
run = "pnpm install --filter @app/website..."

[tasks.db-reset]
description = "Resets local schema and applies migrations without the production data seed"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm exec supabase db reset --no-seed --yes"

[tasks.backup-db]
description = "Dumps the linked production database (read-only) to backup_<timestamp>/ using the password from Doppler prd"
depends = ["database-install"]
run = "doppler run --project dubbingbase --config prd -- ./backup_db.sh"

[tasks.website]
description = "Starts the local Supabase backend and runs the website"
depends = ["website-install", "backend"]
dir = "apps/website"
run = "doppler run --project dubbingbase --config dev -- node ../../scripts/local-supabase.mjs website"

[tasks.website-typecheck]
description = "Type checks only the website workspace"
depends = ["website-install"]
run = "pnpm --filter @app/website typecheck"

[tasks.changeset]
description = "Create a new changeset to describe package changes"
depends = ["install"]
run = "pnpm changeset"

[tasks.bump]
description = "Consumes changesets, bumps versions, commits, tags, and pushes to remote"
depends = ["install"]
run = """
if [ "$(git branch --show-current)" != "main" ]; then
  echo "❌ Error: You can only run 'mise run bump' on the 'main' branch (current: $(git branch --show-current))!"
  exit 1
fi

pnpm changeset version
git add .
git diff --cached --quiet || git commit -m "chore: version packages"
pnpm changeset tag
git push && git push origin --tags
"""

[tasks.gen-types]
description = "Generates database types from Supabase"
depends = ["database-install", "backend"]
dir = "packages/database"
run = "pnpm exec supabase gen types --lang=typescript > src/database.types.ts && pnpm exec oxfmt src/database.types.ts && node scripts/normalize-nullable-rpc-args.mjs"

[tasks.supabase-link]
description = "Links the local Supabase CLI to the production project (read-only use)"
hide = true
depends = ["database-install"]
dir = "packages/database"
run = "doppler run --project dubbingbase --config prd -- pnpm exec supabase link --project-ref rrjgbneefiwoqvsjwzrz"

[tasks.fetch-seed]
description = "Dumps production application data for a local reseed"
depends = ["supabase-link"]
dir = "packages/database"
run = "doppler run --project dubbingbase --config prd -- pnpm exec supabase db dump --data-only -x storage.buckets --file supabase/seed.sql --remote"

[tasks.sync-storage]
description = "Refreshes local Storage bucket files from the linked production project"
depends = ["supabase-link"]
dir = "packages/database"
run = "doppler run --project dubbingbase --config prd -- ./sync-storage.sh"

[tasks.reseed]
description = "Fetches production data and uses the normal local Supabase reset flow"
depends = ["fetch-seed", "backend"]
dir = "packages/database"
# The CLI loads the whole seed into memory (~2.6 GB for the 80 MB dump) and gets OOM-killed,
# so reset without seeding and stream the seed through psql instead.
# The dump has production's schema, so reset only up to the newest migration production has applied, load the
# data, then apply the migrations production does not have yet on top of it (a migration that changes columns
# cannot receive a dump taken before it).
run = """
set -e
PROD_VERSION=$(doppler run --project dubbingbase --config prd -- pnpm exec supabase migration list --output-format json --remote | node scripts/production-schema-version.mjs)
pnpm exec supabase db reset --no-seed --yes --version "$PROD_VERSION"
DB_URL=$(node ../../scripts/local-supabase.mjs db-url)
psql "$DB_URL" -v ON_ERROR_STOP=1 -q -1 -f supabase/seed.sql
pnpm exec supabase migration up
pnpm exec supabase seed buckets
"""

[tasks.pull-production]
description = "Restores local Supabase from production: database seed, then Storage files (read-only on production)"
run = """
mise run reseed
# The link pins the service versions of production; restart so the running containers match.
mise run backend-stop
mise run backend
mise run sync-storage
"""

[tasks.typecheck]
description = "Type checks all workspaces"
depends = ["install"]
run = "pnpm typecheck"

[tasks.fetch-dubbing]
description = "Fetches dubbing data from Wikipedia and enqueues to Supabase"
depends = ["website-install"]
run = "npx --yes tsx scripts/fetch_wikipedia_dubbing.ts"

[tasks.check]
description = "Builds the website to verify TypeScript, Vue templates, and Nitro server routes"
depends = ["website-install"]
run = "pnpm --filter=@app/website build"
