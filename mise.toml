[tools]
deno = "2.1.9"
node = "24"

[env]
# _.file = '.env.production'
_.file = '.env.development'

[tasks.install]
description = "Installs dependencies"
run = "pnpm install"

[tasks.backend]
description = "Starts the Supabase backend"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase start"

[tasks.backend-stop]
description = "Stop the Supabase backend"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase stop"


[tasks.format]
description = "Format codebase using Prettier"
run = "pnpm run format"

[tasks.format-staged]
description = "Format only staged files using lint-staged"
run = "npx lint-staged"

[tasks.dev]
description = "Runs the development server"
depends = ["install", "backend"]
run = "pnpm run dev"

[tasks.sync]
description = "Sync capacitor assets"
depends = ["build-web"]
dir = "apps/mobile"
run = "pnpm cap sync"

[tasks.build-web]
description = "Builds the web app"
depends = ["install"]
run = "pnpm build"

[tasks.migrate-up]
description = "Runs the database migration"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase migration up"

[tasks.migrate-down]
description = "Reverts the database migration"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase migration down"

[tasks.pull-production]
description = "Pulls the production database"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase db dump -f supabase/seed.sql --data-only --linked"

[tasks.db-reset]
description = "Resets the database migration"
depends = ["pull-production"]
dir = "packages/database"
run = "pnpm supabase db reset --local"

[tasks.backup-db]
description = "Backups the database"
depends = ["install"]
run = "./backup_db.sh"

[tasks.start-emulator]
description = "Starts the Android emulator"
depends = ["install"]
run = "$ANDROID_HOME/emulator/emulator -avd Medium_Phone_API_36.0"

[tasks.android-dev]
description = "Runs the Android app in development"
depends = ["install", "start-emulator"]
dir = "apps/mobile"
run = "pnpm cap run android"
env = { "VITE_SUPABASE_URL" = "http://10.0.2.2:55321", "VITE_SUPABASE_PUBLISHABLE_KEY" = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH" }

[tasks.android-app-install]
description = "Installs the Android app"
depends = ["android-build-prod"]
run = "adb install -r apps/mobile/android/app/build/outputs/apk/universal/release/app-universal-release.apk"

[tasks.app]
description = "Starts the mobile app in web mode"
depends = ["install"]
dir = "apps/mobile"
run = "pnpm dev"

[tasks.website]
description = "Runs the website"
depends = ["install"]
dir = "apps/website"
run = "doppler run -- sh -c 'node ../../scripts/check-local-supabase-env.mjs && exec pnpm dev --host 0.0.0.0'"

[tasks.landing]
description = "Runs the public facing landing website"
depends = ["install"]
dir = "apps/landing"
run = "pnpm dev"

[tasks.changeset]
description = "Create a new changeset to describe package changes"
run = "pnpm changeset"

[tasks.bump]
description = "Consumes changesets, bumps versions, commits, tags, and pushes to remote"
run = """
if [ "$(git branch --show-current)" != "main" ]; then
  echo "❌ Error: You can only run 'mise run bump' on the 'main' branch (current: $(git branch --show-current))!"
  exit 1
fi

pnpm changeset version
git add .
git diff --cached --quiet || git commit -m "chore: version packages"
pnpm changeset tag
git push && git push origin --tags
"""

[tasks.gen-types]
description = "Generates database types from Supabase"
depends = ["install", "backend"]
dir = "packages/database"
run = "npx supabase gen types --lang=typescript --local > src/database.types.ts"

[tasks.fetch-seed]
description = "Fetches seed data from the remote database"
depends = ["install"]
dir = "packages/database"
run = "npx supabase db dump --data-only --exclude public.dubbing_languages -f supabase/seed.sql --linked"

[tasks.prepare-seed]
description = "Creates required folders and removes .keep files to avoid mime-type errors during seed"
depends = ["fetch-seed"]
dir = "packages/database"
run = "./prepare-seed.sh"

[tasks.reseed]
description = "Refreshes local Supabase, imports production data before regional migrations, then applies them"
depends = ["prepare-seed"]
dir = "packages/database"
run = """
set -e

# Start schema-only, reset to the snapshot's migration checkpoint, then load
# production data before the regional mapping and later migrations.
seed_was_enabled="$(python3 -c 'from pathlib import Path; import re; s=Path("supabase/config.toml").read_text(); m=re.search(r"(?ms)^\\[db\\.seed\\]\\s*$(.*?)(?=^\\[|\\Z)", s); print(re.search(r"(?m)^enabled = (\\w+)$", m.group(1)).group(1) if m else "false")')"
set_seed_enabled() {
  python3 - "$1" <<'PY'
from pathlib import Path
import re
import sys

path = Path("supabase/config.toml")
text = path.read_text()
enabled = sys.argv[1]
pattern = r"(?ms)(^\\[db\\.seed\\]\\s*.*?^enabled = )(?:true|false)(\\s*$)"
updated, count = re.subn(pattern, rf"\\g<1>{enabled}\\g<2>", text, count=1)
if count != 1:
    raise SystemExit("Could not find [db.seed].enabled in supabase/config.toml")
path.write_text(updated)
PY
}
restore_seed_setting() {
  if [ "$seed_was_enabled" = "true" ]; then
    set_seed_enabled true
  fi
}
trap restore_seed_setting EXIT
if [ "$seed_was_enabled" = "true" ]; then
  set_seed_enabled false
fi

npx supabase stop --no-backup
npx supabase start
npx supabase db reset --local --version 20260926094824 --no-seed --yes
restore_seed_setting
trap - EXIT
project_id="$(sed -n 's/^project_id = "\\(.*\\)"$/\\1/p' supabase/config.toml | head -1)"
{
  printf '%s\\n' 'BEGIN;' 'ALTER TABLE public.dubbing_projects DISABLE TRIGGER dubbing_project_regional_language_guard;'
  cat supabase/seed.sql
  printf '%s\\n' 'ALTER TABLE public.dubbing_projects ENABLE TRIGGER dubbing_project_regional_language_guard;' 'COMMIT;'
} | docker exec -i "supabase_db_${project_id}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
npx supabase migration up --local
"""

[tasks.typecheck]
description = "Run TypeScript type checking across all workspaces"
depends = ["install"]
run = "pnpm typecheck"

[tasks.fetch-dubbing]
description = "Fetches dubbing data from Wikipedia and enqueues to Supabase"
depends = ["install"]
run = "npx --yes tsx scripts/fetch_wikipedia_dubbing.ts"

[tasks.check]
description = "Builds the website to verify TypeScript, Vue templates, and Nitro server routes"
run = "pnpm --filter=@app/website build"
