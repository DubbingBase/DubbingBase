[tools]
deno = "2.1.9"
node = "24"

[env]
# _.file = '.env.production'
_.file = '.env.development'

[tasks.install]
description = "Installs every workspace"
run = "pnpm install"

[tasks.backend]
description = "Starts the Supabase backend"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm supabase start"

[tasks.backend-stop]
description = "Stop the Supabase backend"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm supabase stop"


[tasks.format]
description = "Formats the whole repository"
run = "pnpm run format"

[tasks.format-staged]
description = "Format only staged files using lint-staged"
run = "npx lint-staged"

[tasks.dev]
description = "Runs the workspace development servers"
depends = ["install", "backend"]
run = "pnpm run dev"

[tasks.build-web]
description = "Builds the web app"
depends = ["website-install"]
run = "pnpm --filter @app/website build"

[tasks.migrate-up]
description = "Runs the database migration"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm supabase migration up"

[tasks.migrate-down]
description = "Reverts the database migration"
depends = ["database-install"]
dir = "packages/database"
run = "pnpm supabase migration down"

[tasks.database-install]
description = "Installs only the database workspace dependencies"
run = "pnpm install --filter @app/supabase..."

[tasks.website-install]
description = "Installs only the website workspace and its dependencies"
run = "pnpm install --filter @app/website..."

[tasks.pull-production]
description = "Alias for fetching the production reseed data"
run = "mise run fetch-seed"

[tasks.db-reset]
description = "Resets local schema and applies migrations without the production data seed"
depends = ["database-install"]
dir = "packages/database"
run = "npx supabase db reset --local --no-seed --yes"

[tasks.backup-db]
description = "Backups the database"
depends = ["database-install"]
run = "./backup_db.sh"

[tasks.website]
description = "Runs the website"
depends = ["website-install"]
dir = "apps/website"
run = "doppler run -- sh -c 'node ../../scripts/check-local-supabase-env.mjs && exec pnpm dev --host 0.0.0.0'"

[tasks.website-typecheck]
description = "Type checks only the website workspace"
depends = ["website-install"]
run = "pnpm --filter @app/website typecheck"

[tasks.changeset]
description = "Create a new changeset to describe package changes"
run = "pnpm changeset"

[tasks.bump]
description = "Consumes changesets, bumps versions, commits, tags, and pushes to remote"
run = """
if [ "$(git branch --show-current)" != "main" ]; then
  echo "❌ Error: You can only run 'mise run bump' on the 'main' branch (current: $(git branch --show-current))!"
  exit 1
fi

pnpm changeset version
git add .
git diff --cached --quiet || git commit -m "chore: version packages"
pnpm changeset tag
git push && git push origin --tags
"""

[tasks.gen-types]
description = "Generates database types from Supabase"
depends = ["database-install", "backend"]
dir = "packages/database"
run = "npx supabase gen types --lang=typescript --local > src/database.types.ts && node scripts/normalize-nullable-rpc-args.mjs"

[tasks.fetch-seed]
description = "Dumps production application data for a local reseed"
depends = ["database-install"]
dir = "packages/database"
run = "npx supabase db dump --data-only --file supabase/seed.sql --linked"

[tasks.sync-storage]
description = "Refreshes local Storage bucket files from the linked production project"
depends = ["database-install"]
dir = "packages/database"
run = "./sync-storage.sh"

[tasks.reseed]
description = "Fetches production data and uses the normal local Supabase reset flow"
depends = ["fetch-seed"]
dir = "packages/database"
run = "npx supabase db reset --local --yes"

[tasks.typecheck]
description = "Type checks all workspaces"
depends = ["install"]
run = "pnpm typecheck"

[tasks.fetch-dubbing]
description = "Fetches dubbing data from Wikipedia and enqueues to Supabase"
depends = ["website-install"]
run = "npx --yes tsx scripts/fetch_wikipedia_dubbing.ts"

[tasks.check]
description = "Builds the website to verify TypeScript, Vue templates, and Nitro server routes"
run = "pnpm --filter=@app/website build"
