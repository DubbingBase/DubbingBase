[tools]
deno = "2.1.9"
node = "24.14"

[env]
# _.file = '.env.production'
_.file = '.env.development'

[tasks.install]
description = "Installs dependencies"
run = "pnpm install"

[tasks.backend]
description = "Starts the Supabase backend"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase start"

[tasks.backend-stop]
description = "Stop the Supabase backend"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase stop"

[tasks.functions]
description = "Starts the Supabase functions"
depends = ["install"]
run = "pnpm --filter=@app/supabase dev"

[tasks.function-deploy]
description = "Deploys the Supabase functions"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase functions deploy"

[tasks.dev]
description = "Runs the development server"
depends = ["install", "backend"]
run = "pnpm run dev"

[tasks.sync]
description = "Sync capacitor assets"
depends = ["build-web"]
dir = "apps/mobile"
run = "pnpm cap sync"

[tasks.build-web]
description = "Builds the web app"
depends = ["install"]
run = "pnpm build"

[tasks.migrate-up]
description = "Runs the database migration"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase migration up"

[tasks.migrate-down]
description = "Reverts the database migration"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase migration down"

[tasks.pull-production]
description = "Pulls the production database"
depends = ["install"]
dir = "packages/database"
run = "pnpm supabase db dump -f supabase/seed.sql --data-only --linked"

[tasks.db-reset]
description = "Resets the database migration"
depends = ["pull-production"]
dir = "packages/database"
run = "pnpm supabase db reset --local"

[tasks.backup-db]
description = "Backups the database"
depends = ["install"]
run = "./backup_db.sh"

[tasks.start-emulator]
description = "Starts the Android emulator"
depends = ["install"]
run = "$ANDROID_HOME/emulator/emulator -avd Medium_Phone_API_36.0"

[tasks.android-dev]
description = "Runs the Android app in development"
depends = ["install", "start-emulator"]
dir = "apps/mobile"
run = "pnpm cap run android"
env = { "VITE_SUPABASE_URL" = "http://10.0.2.2:55321", "VITE_SUPABASE_PUBLISHABLE_KEY" = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH" }

[tasks.android-build-prod]
description = "Builds the Android app for production"
depends = ["install", "sync", "build-web"]
dir = "apps/mobile"
run = "pnpm cap build android"
env = { VITE_SUPABASE_URL = "https://rrjgbneefiwoqvsjwzrz.supabase.co", VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH" }

[tasks.android-app-install]
description = "Installs the Android app"
depends = ["android-build-prod"]
run = "adb install -r apps/mobile/android/app/build/outputs/apk/universal/release/app-universal-release.apk"

[tasks.app]
description = "Starts the mobile app in web mode"
depends = ["install"]
dir = "apps/mobile"
run = "pnpm dev"

[tasks.website]
description = "Runs the website"
depends = ["install"]
dir = "apps/website"
run = "pnpm dev"

[tasks.changeset]
description = "Create a new changeset to describe package changes"
run = "pnpm changeset"

[tasks.bump]
description = "Consumes changesets, bumps versions, commits, tags, and pushes to remote"
run = """
if [ "$(git branch --show-current)" != "main" ]; then
  echo "❌ Error: You can only run 'mise run bump' on the 'main' branch (current: $(git branch --show-current))!"
  exit 1
fi

pnpm changeset version
git add .
git diff --cached --quiet || git commit -m "chore: version packages"
pnpm changeset tag
git push && git push origin --tags
"""

[tasks.check-functions]
description = "Verifies all Edge Functions are configured in supabase/config.toml"
dir = "packages/database"
run = "./check-functions.sh"

[tasks.gen-types]
description = "Generates database types from Supabase"
depends = ["install", "backend"]
dir = "packages/database"
run = "npx supabase gen types --lang=typescript --local > supabase/functions/_shared/database.types.ts"

[tasks.fetch-seed]
description = "Fetches seed data from the remote database"
depends = ["install"]
dir = "packages/database"
run = "npx supabase db dump --data-only -f supabase/seed.sql --linked"

[tasks.sync-storage]
description = "Fetches storage buckets from the remote database and uploads them locally"
depends = ["fetch-seed"]
dir = "packages/database"
run = "./sync-storage.sh"

[tasks.reseed]
description = "Fetches seed data and storage from remote and resets local database"
depends = ["sync-storage"]
dir = "packages/database"
run = "npx supabase db reset --local"

[tasks.typecheck]
description = "Run TypeScript type checking across all workspaces"
depends = ["install"]
run = "pnpm typecheck"

[tasks.fetch-dubbing]
description = "Fetches dubbing data from Wikipedia and enqueues to Supabase"
depends = ["install"]
run = "npx --yes tsx scripts/fetch_wikipedia_dubbing.ts"

[tasks.fetch-dubbing-prod]
description = "PROD: Fetches dubbing data and enqueues to PRODUCTION Supabase"
depends = ["install"]
env_file = ".env.production"
run = "./scripts/fetch-dubbing-prod.sh"
