name = "dubbingbase-website"
main = ".output/server/index.mjs"
upload_source_maps = true # Keep production CPU profiles symbolized.
# Avoid runtime name-restoration helpers during per-request SSR setup.
keep_names = false
compatibility_date = "2026-09-08"

[cache]
enabled = true

# Run the Worker near its backends (Supabase, TMDB) so invocations concentrate in
# fewer isolates; young isolates pay a large first-render cost (about 100-150 ms).
[placement]
mode = "smart"

[assets]
directory = ".output/public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "340974572b504ed2aa20c160e18f5697"

[[ratelimits]]
name = "PROFILE_PICTURE_UPLOAD_LIMITER"
namespace_id = "5636541"

[ratelimits.simple]
limit = 10
period = 60

[triggers]
crons = ["* * * * *", "0 6 * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.01
