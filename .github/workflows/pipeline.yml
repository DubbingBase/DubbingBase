name: Release and Deployment Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force_website_deploy:
        description: "Run website checks and deployment for the current main commit."
        required: false
        type: boolean
        default: false
      allow_e2e_pending:
        description: "With explicit user authorization, allow deployment while only E2E is pending. All other required checks must pass."
        required: false
        type: boolean
        default: false
      database_baseline_sha:
        description: "For the website override, latest successful main release commit to verify no database changes are pending."
        required: false
        type: string

# Keep branch checks current and serialize main releases around production migrations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an in-flight production migration and deployment finish before a newer main run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Grant permissions required for posting Netlify deployments, comments, and statuses
permissions:
  contents: write
  deployments: write
  statuses: write
  pull-requests: write

env:
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
  PNPM_CONFIG_MINIMUM_RELEASE_AGE_STRICT: false

jobs:
  # Job 1: Setup and Detect what needs to be run
  detect:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database == 'true' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.force_website_deploy) }}
      database_validation: ${{ steps.filter.outputs.database_validation }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.force_website_deploy) }}
      website_validation: ${{ steps.filter.outputs.website_validation == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.force_website_deploy) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'packages/database/**'
            database_validation:
              - 'packages/database/**'
              - '.github/workflows/pipeline.yml'
            mobile:
              - 'apps/mobile/**'
            website:
              - 'apps/website/**'
              - 'packages/shared-logic/**'
              - 'packages/locales/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            website_validation:
              - 'apps/website/**'
              - 'packages/shared-logic/**'
              - 'packages/locales/**'
              - 'AGENTS.md'
              - '.agents/AGENTS.md'
              - '.changeset/**'
              - 'package.json'
              - 'playwright.config.ts'
              - 'e2e/**'
              - '.github/**'
              - 'pnpm-lock.yaml'

  # Job 2: Validate database migrations and pgTAP tests against local Supabase
  database-checks:
    needs: detect
    if: needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install database dependencies
        run: pnpm install --filter @app/supabase... --filter dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Start isolated local Supabase
        id: local-supabase
        run: mise run backend

      - name: Replay migrations on local Supabase
        run: mise run db-reset

      - name: Verify generated database types
        run: |
          mise run gen-types
          expected_types="$(mktemp --suffix=.ts)"
          trap 'rm -f "$expected_types"' EXIT
          git show "HEAD:packages/database/src/database.types.ts" > "$expected_types"
          pnpm exec prettier --write "$expected_types" packages/database/src/database.types.ts
          cmp -s "$expected_types" packages/database/src/database.types.ts || {
            echo "::error::Generated database types differ after formatting."
            exit 1
          }

      - name: Typecheck database package
        run: pnpm --filter=@app/supabase run typecheck

      - name: Run local database tests
        run: pnpm supabase test db
        working-directory: packages/database

      - name: Run credit import transaction and concurrency regressions
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55322 -U postgres -d postgres \
            -f tests/admin-credit-imports.sql
          bash tests/admin-credit-imports-concurrency.sh
        working-directory: packages/database

  # Job 3: E2E Tests
  e2e-tests:
    needs: [detect]
    if: |
      !(
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.force_website_deploy &&
        inputs.allow_e2e_pending
      ) &&
      (
        needs.detect.outputs.mobile == 'true' ||
        needs.detect.outputs.website_validation == 'true' ||
        needs.detect.outputs.database_validation == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=website

  # Job 3.5: Frontend Unit Tests
  frontend-tests:
    needs: [detect]
    if: needs.detect.outputs.website_validation == 'true' || needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Run Vitest tests
        run: pnpm --filter=@app/website run test --run

  # Job 3.55: Website TypeScript Check
  typecheck-website:
    needs: [detect]
    if: needs.detect.outputs.website_validation == 'true' || needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Typecheck website
        run: pnpm --filter=@app/website run typecheck

  # Job 3.56: Lint changed website source and prevent release lint regressions
  lint-website:
    needs: [detect]
    if: needs.detect.outputs.website == 'true' || needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install website dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Compare full website lint with the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$BASE_SHA^{commit}"

          baseline_dir="$(mktemp -d)"
          baseline_results="$(mktemp)"
          head_results="$(mktemp)"
          trap 'rm -rf "$baseline_dir"; rm -f "$baseline_results" "$head_results"' EXIT
          git archive "$BASE_SHA" .gitignore apps/website | tar -x -C "$baseline_dir"

          node --check scripts/compare-oxlint-results.mjs

          set +e
          (
            cd "$baseline_dir"
            "$GITHUB_WORKSPACE/node_modules/.bin/oxlint" \
              -c "$GITHUB_WORKSPACE/.oxlintrc.json" \
              --vue-plugin --format json --ignore-path .gitignore apps/website
          ) > "$baseline_results"
          baseline_status=$?
          pnpm exec oxlint -c .oxlintrc.json --vue-plugin --format json apps/website > "$head_results"
          head_status=$?
          set -e

          node scripts/compare-oxlint-results.mjs \
            "$baseline_results" "$baseline_status" \
            "$head_results" "$head_status"

          mapfile -d '' -t changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- apps/website
          )
          lint_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts|*.vue)
                lint_files+=("$file")
                ;;
            esac
          done

          if [ "${#lint_files[@]}" -eq 0 ]; then
            echo "No changed website source files to lint."
          else
            pnpm exec oxlint -c .oxlintrc.json --vue-plugin --deny-warnings "${lint_files[@]}"
          fi

  # Job 3.6: Whitespace Check for Website-Scoped Changes
  diff-check:
    needs: [detect]
    if: needs.detect.outputs.website_validation == 'true' || needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check website-scoped diff whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          git diff --check "$base_sha" HEAD -- \
            AGENTS.md \
            .agents/AGENTS.md \
            .changeset \
            .github/workflows/pipeline.yml \
            apps/website \
            e2e \
            ':(exclude)e2e/mobile.spec.ts' \
            package.json \
            packages/locales \
            packages/database \
            packages/shared-logic \
            playwright.config.ts \
            pnpm-lock.yaml

  # Job 3.7: i18n Translation Check
  i18n-check:
    needs: [detect]
    if: needs.detect.outputs.website_validation == 'true' || needs.detect.outputs.mobile == 'true' || needs.detect.outputs.database_validation == 'true'
    continue-on-error: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Check i18n keys
        run: pnpm i18n:check

  # Job 4: Deploy Mobile App as Website
  deploy-mobile-web:
    needs: [detect, deploy-supabase, release-validation, e2e-tests, frontend-tests, i18n-check]
    # A skipped migration is expected only when no database files changed.
    if: |
      always() &&
      !cancelled() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.mobile == 'true' &&
      needs.e2e-tests.result == 'success' &&
      needs.i18n-check.result == 'success' &&
      (
        needs.frontend-tests.result == 'success' ||
        (
          needs.detect.outputs.database != 'true' &&
          needs.detect.outputs.website != 'true' &&
          needs.frontend-tests.result == 'skipped'
        )
      ) &&
      (
        needs.release-validation.result == 'success' ||
        (
          needs.detect.outputs.database != 'true' &&
          needs.detect.outputs.website != 'true' &&
          needs.release-validation.result == 'skipped'
        )
      ) &&
      (
        needs.deploy-supabase.result == 'success' ||
        (
          needs.detect.outputs.database != 'true' &&
          needs.deploy-supabase.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Build mobile website
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          VITE_API_BASE_URL: https://dubbingbase.com
        run: pnpm --filter=@app/mobile build

      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./apps/mobile/dist"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Mobile Web from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MOBILE_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # Job 5: Build Android app (TEMPORARILY DISABLED - re-enable by restoring the mobile-change condition)
  build-android:
    needs: [detect, deploy-supabase, e2e-tests, frontend-tests, i18n-check]
    # Temporarily disabled; re-enable by restoring the original condition:
    # always() && needs.detect.outputs.mobile == 'true' && (...)
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Setup Android signing - Capacitor
        run: |
          base64 -d <<< "${{ secrets.KEYSTORE_FILE }}" > ./apps/mobile/android/dubbing-base-keystore.jks

      - name: Set Android dev version name
        if: "github.ref != 'refs/heads/main'"
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "ANDROID_VERSION_NAME=${VERSION}-build.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set Android production version code
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build Android Release
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        working-directory: apps/mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          VITE_API_BASE_URL: https://dubbingbase.com
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
        run: |
          pnpm build
          pnpm cap sync
          pnpm cap build android --androidreleasetype AAB
          pnpm cap build android --androidreleasetype APK

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 30

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  # Job 6: Upload AAB to Play Store (runs only on main branch pushes)
  upload-play-store:
    needs: [detect, build-android]
    if: |
      always() &&
      github.event_name != 'pull_request' && 
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.mobile == 'true' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-bundle

      - name: Upload .aab to Google Play
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          package_name: "com.dubbingbase.app"
          aab_file_path: "app-release-signed.aab"
          track: internal
          release_status: "completed"

  # Job 7: Build website before release validation; main deployment reuses this artifact
  build-website:
    needs: [detect]
    if: |
      needs.detect.outputs.website_validation == 'true' ||
      needs.detect.outputs.database_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Build website
        if: github.ref == 'refs/heads/main'
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NUXT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NUXT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUXT_TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          NUXT_IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          NUXT_IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NUXT_GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY || secrets.NUXT_GOOGLE_AI_KEY || secrets.GEMINI_API_KEY }}
          NUXT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.NUXT_GROQ_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
          NUXT_DISCORD_WEBHOOK_DISCOVERY_URL: ${{ secrets.DISCORD_WEBHOOK_DISCOVERY_URL || secrets.NUXT_DISCORD_WEBHOOK_DISCOVERY_URL || secrets.DISCORD_DISCOVERY_WEBHOOK_URL }}
          NUXT_DISCORD_WEBHOOK_CHECK_URL: ${{ secrets.DISCORD_WEBHOOK_CHECK_URL || secrets.NUXT_DISCORD_WEBHOOK_CHECK_URL || secrets.DISCORD_CHECK_WEBHOOK_URL }}
          NUXT_DISCORD_WEBHOOK_EXTRACT_URL: ${{ secrets.DISCORD_WEBHOOK_EXTRACT_URL || secrets.NUXT_DISCORD_WEBHOOK_EXTRACT_URL || secrets.DISCORD_EXTRACT_WEBHOOK_URL }}
          NUXT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.NUXT_DISCORD_WEBHOOK_URL || secrets.DISCORD_ADMIN_WEBHOOK_LOG_URL }}
          NUXT_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUXT_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NUXT_RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          NUXT_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NITRO_PRESET: cloudflare-module
        run: pnpm --filter=@app/website build

      - name: Build website with non-production values
        if: github.ref != 'refs/heads/main'
        env:
          NUXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: mock-publishable-key
          SUPABASE_PUBLISHABLE_KEY: mock-publishable-key
          NUXT_SUPABASE_URL: https://mock.supabase.co
          NUXT_SUPABASE_SECRET_KEY: mock-secret-key
          NUXT_TMDB_API_KEY: mock-tmdb-key
          NUXT_TVDB_API_KEY: mock-tvdb-key
          NUXT_IGDB_CLIENT_ID: mock-igdb-client-id
          NUXT_IGDB_CLIENT_SECRET: mock-igdb-client-secret
          NUXT_GOOGLE_AI_KEY: mock-google-ai-key
          NUXT_GROQ_API_KEY: mock-groq-api-key
          NUXT_ONESIGNAL_APP_ID: mock-onesignal-app-id
          NUXT_ONESIGNAL_REST_API_KEY: mock-onesignal-rest-api-key
          NUXT_DISCORD_WEBHOOK_DISCOVERY_URL: https://example.invalid/discovery
          NUXT_DISCORD_WEBHOOK_CHECK_URL: https://example.invalid/check
          NUXT_DISCORD_WEBHOOK_EXTRACT_URL: https://example.invalid/extract
          NUXT_DISCORD_WEBHOOK_URL: https://example.invalid/admin
          NUXT_RESEND_API_KEY: mock-resend-api-key
          NUXT_RESEND_FROM_EMAIL: no-reply@example.invalid
          NUXT_RESEND_TO_EMAIL: admin@example.invalid
          NUXT_ADMIN_EMAIL: admin@example.invalid
          NITRO_PRESET: cloudflare-module
        run: pnpm --filter=@app/website build

      - name: Verify hidden production build output
        if: github.ref == 'refs/heads/main' && needs.detect.outputs.website == 'true'
        run: |
          test -f apps/website/.output/public/.well-known/assetlinks.json
          well_known_entry_count="$(find apps/website/.output/public/.well-known -mindepth 1 -print | wc -l | tr -d '[:space:]')"
          if [ "$well_known_entry_count" -ne 1 ]; then
            echo "Unexpected files in .well-known build output." >&2
            exit 1
          fi
          unexpected_hidden_paths="$(find apps/website/.output -mindepth 1 \( -type d -o -type f -o -type l \) -name '.*' ! -path 'apps/website/.output/public/.well-known' -print)"
          if [ -n "$unexpected_hidden_paths" ]; then
            printf 'Unexpected hidden build output:\n%s\n' "$unexpected_hidden_paths" >&2
            exit 1
          fi

      - name: Upload production website build
        if: github.ref == 'refs/heads/main' && needs.detect.outputs.website == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: apps/website/.output/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Job 7.5: Require every relevant preflight check to succeed
  manual-website-guard:
    needs: [detect]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.force_website_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify database baseline has no pending database changes
        env:
          DATABASE_BASELINE_SHA: ${{ inputs.database_baseline_sha }}
        shell: bash
        run: |
          if [[ ! "$DATABASE_BASELINE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Provide database_baseline_sha from the latest successful main release."
            exit 1
          fi

          if ! git cat-file -e "${DATABASE_BASELINE_SHA}^{commit}"; then
            echo "::error::database_baseline_sha is not an available commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$DATABASE_BASELINE_SHA" "$GITHUB_SHA"; then
            echo "::error::database_baseline_sha must be an ancestor of this main commit."
            exit 1
          fi

          if ! git diff --quiet "$DATABASE_BASELINE_SHA" "$GITHUB_SHA" -- packages/database/; then
            echo "::error::Database changes exist since the baseline; use the regular release path."
            git diff --name-only "$DATABASE_BASELINE_SHA" "$GITHUB_SHA" -- packages/database/
            exit 1
          fi

          echo "No database changes exist since $DATABASE_BASELINE_SHA."

  release-validation:
    needs:
      [
        detect,
        manual-website-guard,
        database-checks,
        e2e-tests,
        frontend-tests,
        lint-website,
        typecheck-website,
        diff-check,
        i18n-check,
        build-website,
      ]
    if: |
      always() &&
      !cancelled() &&
      needs.detect.result == 'success' &&
      (needs.detect.outputs.website_validation == 'true' || needs.detect.outputs.database_validation == 'true') &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.force_website_deploy &&
          needs.manual-website-guard.result == 'success'
        ) ||
        (
          !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.force_website_deploy) &&
          needs.manual-website-guard.result == 'skipped'
        )
      ) &&
      (
        needs.e2e-tests.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.force_website_deploy &&
          inputs.allow_e2e_pending &&
          needs.e2e-tests.result == 'skipped'
        )
      ) &&
      needs.frontend-tests.result == 'success' &&
      needs.lint-website.result == 'success' &&
      needs.typecheck-website.result == 'success' &&
      needs.diff-check.result == 'success' &&
      needs.i18n-check.result == 'success' &&
      needs.build-website.result == 'success' &&
      (needs.detect.outputs.database_validation != 'true' || needs.database-checks.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release preflight passed
        run: echo "Required release validation passed."

  # Job 7.6: Apply production migrations only after release validation
  deploy-supabase:
    needs: [detect, release-validation]
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.database == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.force_website_deploy) &&
      needs.release-validation.result == 'success'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: rrjgbneefiwoqvsjwzrz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.1.9"

      - name: Install database dependencies
        run: pnpm install --filter @app/supabase... --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Link Project
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref $PROJECT_ID
        working-directory: packages/database

      - name: Run database migrations
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Keep stacked migrations deployable when their timestamps merge out of order.
        run: supabase db push --include-all
        working-directory: packages/database

  # Job 8: Deploy website to Cloudflare Workers (main only)
  deploy-website:
    needs: [detect, release-validation, deploy-supabase]
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.website == 'true' &&
      needs.release-validation.result == 'success' &&
      (
        (
          needs.detect.outputs.database == 'true' &&
          needs.deploy-supabase.result == 'success'
        ) ||
        (
          needs.detect.outputs.database != 'true' &&
          needs.deploy-supabase.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=@app/website... --filter=dubbing-base-monorepo --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Download production-compatible website build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: apps/website/.output

      - name: Deploy to Cloudflare Workers
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
