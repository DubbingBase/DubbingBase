name: Release and Deployment Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Prevent concurrent deployments from clashing (especially on db push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Grant permissions required for posting Netlify deployments, comments, and statuses
permissions:
  contents: write
  deployments: write
  statuses: write
  pull-requests: write

jobs:
  # Job 1: Setup and Detect what needs to be run
  detect:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'packages/database/**'
            mobile:
              - 'apps/mobile/**'
            website:
              - 'apps/website/**'
              - 'packages/shared-logic/**'

  # Job 2: Deploy Supabase (runs first if database needs updating)
  deploy-supabase:
    needs: detect
    if: needs.detect.outputs.database == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: rrjgbneefiwoqvsjwzrz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.1.9"

      - name: Install dependencies
        run: pnpm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Link Project
        if: github.ref == 'refs/heads/main'
        run: supabase link --project-ref $PROJECT_ID
        working-directory: packages/database

      - name: Run database migrations
        if: github.ref == 'refs/heads/main'
        run: supabase db push
        working-directory: packages/database

  # Job 3: E2E Tests
  e2e-tests:
    needs: [detect, deploy-supabase]
    if: needs.detect.outputs.mobile == 'true' || needs.detect.outputs.website == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          VITE_API_BASE_URL: https://dubbingbase.com
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: pnpm exec playwright test

  # Job 3.5: Frontend Unit Tests
  frontend-tests:
    needs: [detect]
    if: needs.detect.outputs.website == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Vitest tests
        run: pnpm --filter=@app/website run test --run

  # Job 4: Deploy Mobile App as Website
  deploy-mobile-web:
    needs: [detect, deploy-supabase, e2e-tests, frontend-tests]
    # Run if mobile has changes, and if database job succeeded (or wasn't needed)
    if: |
      always() && 
      needs.detect.outputs.mobile == 'true' && 
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build mobile website
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          VITE_API_BASE_URL: https://dubbingbase.com
        run: pnpm --filter=@app/mobile build

      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./apps/mobile/dist"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Mobile Web from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MOBILE_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # Job 5: Build Android app (runs on any branch if mobile has changes)
  build-android:
    needs: [detect, deploy-supabase, e2e-tests, frontend-tests]
    # Run if mobile has changes, and if database job succeeded (or wasn't needed)
    if: |
      always() &&
      needs.detect.outputs.mobile == 'true' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Setup Android signing - Capacitor
        run: |
          base64 -d <<< "${{ secrets.KEYSTORE_FILE }}" > ./apps/mobile/android/dubbing-base-keystore.jks

      - name: Set Android dev version name
        if: "github.ref != 'refs/heads/main'"
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "ANDROID_VERSION_NAME=${VERSION}-build.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set Android production version code
        if: github.ref == 'refs/heads/main'
        run: echo "ANDROID_VERSION_CODE=$((2000000 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: Build Android Release
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        working-directory: apps/mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          VITE_API_BASE_URL: https://dubbingbase.com
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
        run: |
          pnpm build
          pnpm cap sync
          pnpm cap build android --androidreleasetype AAB
          pnpm cap build android --androidreleasetype APK

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 30

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  # Job 6: Upload AAB to Play Store (runs only on main branch pushes)
  upload-play-store:
    needs: [detect, build-android]
    if: |
      always() &&
      github.event_name != 'pull_request' && 
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.mobile == 'true' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-bundle

      - name: Upload .aab to Google Play
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          package_name: "com.dubbingbase.app"
          aab_file_path: "app-release-signed.aab"
          track: internal
          release_status: "completed"

  # Job 7: Build website (validates build on all branches)
  build-website:
    needs: [detect, deploy-supabase, e2e-tests, frontend-tests]
    if: |
      always() && 
      needs.detect.outputs.website == 'true' && 
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NUXT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NUXT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUXT_TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          NUXT_IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          NUXT_IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NUXT_MISTRAL_TOKEN: ${{ secrets.MISTRAL_TOKEN }}
          NUXT_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          NUXT_ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NUXT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUXT_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUXT_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NUXT_RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          NUXT_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NITRO_PRESET: cloudflare-module
        run: pnpm --filter=@app/website build

  # Job 8: Deploy website to Cloudflare Workers (main only)
  deploy-website:
    needs: [detect, build-website]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.website == 'true' &&
      needs.build-website.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NUXT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NUXT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUXT_TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          NUXT_IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          NUXT_IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NUXT_MISTRAL_TOKEN: ${{ secrets.MISTRAL_TOKEN }}
          NUXT_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          NUXT_ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NUXT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUXT_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUXT_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NUXT_RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          NUXT_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NITRO_PRESET: cloudflare-module
        run: pnpm --filter=@app/website build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@latest deploy
