name: Release and Deployment Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Prevent concurrent deployments from clashing (especially on db push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Grant permissions required for posting Netlify deployments, comments, and statuses
permissions:
  contents: write
  deployments: write
  statuses: write
  pull-requests: write

jobs:
  # Job 1: Setup and Detect what needs to be run
  detect:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'packages/database/**'
            mobile:
              - 'apps/mobile/**'
            website:
              - 'apps/website/**'

  # Job 2: Deploy Supabase (runs first if database needs updating on main)
  deploy-supabase:
    needs: detect
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.database == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: rrjgbneefiwoqvsjwzrz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.1.9"

      - name: Install dependencies
        run: pnpm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Typecheck Edge Functions
        run: |
          cd packages/database
          pnpm run typecheck

      - name: Run database migrations
        run: supabase db push --project-ref $PROJECT_ID
        working-directory: packages/database

      - name: Deploy Supabase functions
        run: supabase functions deploy --project-ref $PROJECT_ID
        working-directory: packages/database

  # Job 3: Deploy Website (runs after deploy-supabase on main)
  deploy-website:
    needs: [detect, deploy-supabase]
    # Run if on main, website has changes, and if database job succeeded (or wasn't needed)
    if: |
      always() && 
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.website == 'true' && 
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        run: pnpm --filter=@app/website build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./apps/website/dist"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # Job 4: Build Android app (runs on any branch if mobile has changes)
  build-android:
    needs: [detect, deploy-supabase]
    # Run if mobile has changes, and if database job succeeded (or wasn't needed)
    if: |
      always() &&
      needs.detect.outputs.mobile == 'true' &&
      (needs.deploy-supabase.result == 'success' || needs.deploy-supabase.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Setup Android signing - Capacitor
        run: |
          base64 -d <<< "${{ secrets.KEYSTORE_FILE }}" > ./apps/mobile/android/dubbing-base-keystore.jks

      - name: Set Android dev version name
        if: "github.ref != 'refs/heads/main'"
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "ANDROID_VERSION_NAME=${VERSION}-build.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build Android Release
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        working-directory: apps/mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
        run: |
          pnpm build
          pnpm cap sync
          pnpm cap build android --androidreleasetype AAB
          pnpm cap build android --androidreleasetype APK

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 30

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  # Job 5: Upload AAB to Play Store (runs only on main branch pushes)
  upload-play-store:
    needs: [detect, build-android]
    if: |
      github.event_name != 'pull_request' && 
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.mobile == 'true' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-bundle

      - name: Upload .aab to Google Play
        uses: KevinRohn/github-action-upload-play-store@v1.0.1
        with:
          service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          package_name: "com.dubbingbase.app"
          aab_file_path: "app-release-signed.aab"
          track: internal
          release_status: "completed"
