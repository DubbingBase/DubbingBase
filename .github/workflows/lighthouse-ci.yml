name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "packages/shared-logic/**"
      - "packages/locales/**"
      - "AGENTS.md"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "packages/shared-logic/**"
      - "packages/locales/**"
      - "AGENTS.md"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-desktop:
    name: Desktop Lighthouse on local production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.minimum-release-age-strict=false

      - name: Build production-like Cloudflare Worker
        run: mise run check
        env:
          E2E_TEST: "true"
          NITRO_PRESET: cloudflare-module

      - name: Start local production Worker
        run: |
          cd apps/website
          pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8787 --var E2E_TEST:true --compatibility-flag nodejs_compat --compatibility-flag disable_nodejs_process_v2 --compatibility-flag nodejs_compat_populate_process_env --log-level info > /tmp/wrangler-lhci.log 2>&1 &
          worker_pid=$!

          for attempt in {1..120}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              break
            fi
            if rg -q "Ready on" /tmp/wrangler-lhci.log; then
              http_status=$(curl --silent --output /tmp/lhci-homepage.html --write-out "%{http_code}" http://127.0.0.1:8787/ || true)
              if [ "$http_status" = "200" ]; then
                echo "Local production Worker homepage returned HTTP 200."
                exit 0
              fi
              echo "Local production Worker homepage returned HTTP $http_status."
              head -c 4000 /tmp/lhci-homepage.html
              tail -n 200 /tmp/wrangler-lhci.log
              exit 1
            fi
            sleep 1
          done

          echo "Local production Worker did not become ready."
          tail -n 200 /tmp/wrangler-lhci.log
          exit 1

      - name: Run desktop Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Show local Worker logs if Lighthouse fails
        if: failure()
        run: |
          if [ -f /tmp/wrangler-lhci.log ]; then
            tail -n 200 /tmp/wrangler-lhci.log
          else
            echo "No Wrangler log was captured."
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
